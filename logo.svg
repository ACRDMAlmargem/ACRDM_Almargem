<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#347474;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a8c8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5ca0a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5d5d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#347474;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#greenGradient)" opacity="0.1"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#greenGradient)" stroke-width="2"/>
  
  <!-- Tree/Community Symbol -->
  <g transform="translate(50, 50)">
    <!-- Tree Trunk -->
    <rect x="-8" y="10" width="16" height="30" fill="url(#accentGradient)" rx="2"/>
    
    <!-- Tree Crown - Community Circles -->
    <circle cx="0" cy="-15" r="25" fill="url(#greenGradient)" opacity="0.8"/>
    <circle cx="-20" cy="-5" r="20" fill="url(#greenGradient)" opacity="0.7"/>
    <circle cx="20" cy="-5" r="20" fill="url(#greenGradient)" opacity="0.7"/>
    <circle cx="-15" cy="5" r="15" fill="url(#greenGradient)" opacity="0.6"/>
    <circle cx="15" cy="5" r="15" fill="url(#greenGradient)" opacity="0.6"/>
    
    <!-- People Icons in Circles -->
    <g fill="white">
      <!-- Center person -->
      <circle cx="0" cy="-15" r="3"/>
      <path d="M -3,-12 Q -3,-8 -5,-5 L -5,0 L -1,0 L -1,-12 Z"/>
      <path d="M 3,-12 Q 3,-8 5,-5 L 5,0 L 1,0 L 1,-12 Z"/>
      
      <!-- Left person -->
      <circle cx="-20" cy="-5" r="2.5"/>
      <path d="M -22,-2 Q -22,1 -24,4 L -24,8 L -20,8 L -20,-2 Z"/>
      <path d="M -18,-2 Q -18,1 -16,4 L -16,8 L -20,8 L -20,-2 Z"/>
      
      <!-- Right person -->
      <circle cx="20" cy="-5" r="2.5"/>
      <path d="M 18,-2 Q 18,1 16,4 L 16,8 L 20,8 L 20,-2 Z"/>
      <path d="M 22,-2 Q 22,1 24,4 L 24,8 L 20,8 L 20,-2 Z"/>
    </g>
    
    <!-- Ground/Base -->
    <ellipse cx="0" cy="45" rx="35" ry="8" fill="url(#accentGradient)" opacity="0.3"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="98" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="url(#accentGradient)">
    ACRDM
  </text>
</svg>
